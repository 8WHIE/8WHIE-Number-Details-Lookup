name: 8WHIE Number Details Lookup

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check project files
        run: |
          echo "Repository files:"
          ls -la

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Verify build
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi
          echo "Build successful!"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: 8whie-number-details-lookup-build
          path: dist
